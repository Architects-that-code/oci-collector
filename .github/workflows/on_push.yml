name: On Branch Push

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  tests:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc \
            libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libx11-dev xorg-dev \
            libwayland-dev libxkbcommon-dev bc

      - name: Run tests
        run: go test ./...

  build-release:
    name: Build Release Binaries
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oci-collector-release-${{ github.sha }}
          path: |
            dist/oci-collector-*
            dist/toolkit-config.yaml
          if-no-files-found: error
